<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti, Izamara</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#07030d;--rose:#e9b7a5;--gold:#f2d3a8;--txt:#fbeee6;--glass:rgba(22,9,32,.58);--line:rgba(242,211,168,.22)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden;font-family:Jost,system-ui,sans-serif;color:var(--txt)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 50%,rgba(4,1,9,.75))}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#ov,#fin,#lb{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,rgba(64,16,52,.7),rgba(7,3,13,.95) 70%);transition:opacity 1.6s}
#fin,#lb{transition:opacity .6s;z-index:8}
#lb{background:rgba(7,3,13,.94);gap:14px}
.off{opacity:0;pointer-events:none}
.panel{width:min(92vw,500px);display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;padding:46px 34px 38px;border:1px solid var(--line);border-radius:28px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.orn{width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
h1,h2{font:italic 500 clamp(54px,13vw,88px)/1 'Cormorant Garamond',serif;margin:0;color:var(--gold);text-shadow:0 0 40px rgba(233,183,165,.4)}
h2{font-size:clamp(30px,7vw,44px);line-height:1.12}
p{margin:0;font:italic 500 clamp(18px,3.8vw,21px)/1.55 'Cormorant Garamond',serif;color:#f6dccf}
.btn{cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--gold);padding:10px 20px;border-radius:999px;font:300 13px Jost,sans-serif;letter-spacing:.06em;transition:background .3s,border-color .3s}
.btn:hover{background:rgba(242,211,168,.12);border-color:rgba(242,211,168,.5)}
.btn:focus-visible,.dot:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.go{background:linear-gradient(135deg,#f6dcb4,#e0948a);color:#2a0b1a;border:0;padding:14px 42px;font-weight:400;font-size:14px;box-shadow:0 10px 36px rgba(224,148,138,.35)}
.go:hover{background:linear-gradient(135deg,#fff0d4,#eaa399)}
.go:disabled{opacity:.5;cursor:wait}
#fade{position:fixed;inset:0;background:radial-gradient(circle,rgba(233,183,165,.2),#07030d 70%);opacity:0;transition:opacity .9s;pointer-events:none;z-index:4}
#un{position:fixed;top:calc(24px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font:italic 500 21px 'Cormorant Garamond',serif;letter-spacing:.05em;opacity:0;transition:opacity 1.4s;z-index:3;pointer-events:none;color:var(--gold)}
#un.on{opacity:.9}
#cap{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,660px);text-align:center;opacity:0;transition:opacity 1s;z-index:3;pointer-events:none;padding:26px 20px;background:radial-gradient(ellipse at center,rgba(7,3,13,.65),transparent 72%)}
#cap.on{opacity:1}
#tag{display:flex;align-items:center;gap:14px;justify-content:center;font:italic 500 17px 'Cormorant Garamond',serif;color:var(--rose);margin-bottom:8px}
#tag:before,#tag:after{content:"";width:38px;height:1px;background:linear-gradient(90deg,transparent,var(--rose))}
#tag:after{transform:scaleX(-1)}
#txt{font:italic 500 clamp(22px,4.8vw,32px)/1.38 'Cormorant Garamond',serif;color:#fff1e8}
#txt i{display:inline-block;opacity:0;filter:blur(7px);transform:translateY(9px);transition:opacity .9s,filter .9s,transform .9s}
#cap.on #txt i{opacity:1;filter:none;transform:none}
#hud{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;align-items:center;padding:7px 10px 7px 16px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:5;opacity:0;transition:opacity 2s 2s;white-space:nowrap}
#hud.on{opacity:1}
#dots{display:flex;gap:9px;margin-right:8px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--rose);background:transparent;padding:0;cursor:pointer;transition:.4s}
.dot.on{background:var(--gold);box-shadow:0 0 12px var(--gold);transform:scale(1.3)}
.ib{border:0;background:transparent;padding:8px 12px}
#li{max-width:calc(100vw - 150px);max-height:86vh;object-fit:contain;border:1px solid var(--line);border-radius:6px;box-shadow:0 30px 90px rgba(0,0,0,.7)}
#lx{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:18px}
@media(max-width:560px){#li{max-width:calc(100vw - 110px)}#lb{padding:12px;gap:6px}}
@media(prefers-reduced-motion:reduce){#txt i{transition:opacity .3s;filter:none;transform:none}}
</style>
</head>
<body>
<div id="ov"><div class="panel">
  <h1 id="tit">Para ti</h1><div class="orn"></div>
  <p>Cuatro universos hechos de planetas, constelaciones y versos. Cada estrella lleva algo de ti.</p>
  <button class="btn go" id="go" disabled>Entrar al universo</button>
</div></div>
<div id="fade"></div><div id="un"></div>
<div id="cap"><div id="tag"></div><div id="txt"></div></div>
<div id="hud"><div id="dots"></div><button class="btn ib" id="gl">Galería</button><button class="btn ib" id="lt">Carta</button></div>
<div id="fin" class="off"><div class="panel"><h2 id="ft"></h2><div class="orn"></div><p id="fm"></p><button class="btn" id="fc">Volver a las estrellas</button></div></div>
<div id="lb" class="off"><button class="btn" id="lp" aria-label="Anterior">‹</button><img id="li" alt="Foto"><button class="btn" id="ln" aria-label="Siguiente">›</button><button class="btn" id="lx">Cerrar</button></div>

const NAME="Izamara";
const PHRASES=["Ojos color café","Tu mirada","Tus labios","Cabello dorado","Tus lentes","Tu piercing","Una perla","Eres poesía","Tu sonrisa","Me encantas","Qué bonita eres","Delineado de artista"];
const CAPS=["Tu mirada","Ojos de café","Tus labios","Poesía"];
const POEMS=[
["tus ojos","Tus ojos son café recién hecho: basta una mirada para que la mañana huela a promesa."],
["tu mirada","Miras de lado, con la calma de quien guarda un secreto; y yo ya me muero por descubrirlo."],
["tu delineado","Tu delineado es un trazo firme de poeta: sabe exactamente dónde empieza la magia."],
["tus pestañas","Cada pestaña es una pincelada de noche; cuando parpadeas, el cielo toma nota."],
["tus lentes","Tus lentes enmarcan el cuadro más bello del universo, y aun así la obra se escapa del marco."],
["tus labios","Tus labios, rojo de atardecer en Marte, dibujan la sonrisa que quisiera merecer."],
["tu labial","Ese rojo no es maquillaje: es un planeta entero que decidió vivir en tu boca."],
["tu nariz","En tu nariz brilla un pequeño aro, la órbita de una luna con muy buen gusto."],
["tu cabello","Tu cabello rubio cae como la luz de las seis de la tarde: dorado, lento, imposible de ignorar."],
["tu flequillo","Ese flequillo enmarca tu mirada como el telón que anuncia la mejor función."],
["tus mejillas","Hay un rubor en tus mejillas que le gana al amanecer; por verlo, madrugaría toda la vida."],
["tu perla","Una perla en tu oreja, y aun así la joya eres tú: lo demás solo te acompaña."],
["tu cuello","Esa gargantilla negra rodea tu cuello como un eclipse delicado alrededor de la luna."],
["tus manos","Cuando escondes la sonrisa tras tu mano, el universo se asoma entre tus dedos para espiarte."],
["tu piel","Tu piel es porcelana tibia; la luz de cualquier estrella se pone celosa."],
["el café","Quisiera conocerte despacio, como un buen café: sin prisa y con ganas de repetir."],
["el destino","Dicen que nada es casualidad; entonces coincidir contigo sería la mejor jugada del destino."],
["latidos","Mi corazón no entiende de cálculos, solo sabe que cerca de tu nombre late distinto."],
["el cosmos","Con un universo tan grande, no entiendo por qué mis ojos insisten en buscarte a ti."]];

mk('Sistema solar',34,g=>{const fl=[],P=[],tl=new T.Group();tl.rotation.x=.26;g.add(tl);
 tl.add(new T.Mesh(new T.SphereGeometry(2,32,24),new T.MeshBasicMaterial({color:0xffe2b0})));const s1=glowSpr('#ffb86b',22,.85);tl.add(s1,glowSpr('#ff7aa8',42,.3),new T.PointLight(0xfff0dd,2.6,0));
 [[.75,['#e9b7a5','#b27a72'],'rock','#ffc9b8',0,6.5,.9,'Tu mirada'],[1.15,['#d9964a','#8a4f22','#f2d3a8'],'rock','#ffb347',0,10,.65,'Tu sonrisa'],[1.9,['#f6d6c9','#d98f9f','#a8476b','#f2d3a8'],'gas','#f5a6c0',1,15.5,.45,'Tus ojos café'],[1.45,['#c9b3ff','#7a5cc9','#3c2a7a'],'gas','#b49bff',0,21,.34,'Tu cabello dorado'],[1.7,['#c99a6b','#6b3d22','#f2d3a8'],'rock','#e0a06b',0,26,.26,'Tu poesía']].forEach(d=>{
  const p=planet(d[0],d[1],d[2],d[3],d[4]),l=textSprite(d[7],'#f2d3a8');l.scale.set(3.6,.72,1);l.position.y=d[0]*(d[4]?2.6:1.8)+.8;p.add(l);tl.add(p);
  tl.add(new T.LineLoop(new T.BufferGeometry().setFromPoints(Array.from({length:128},(_,i)=>V(Math.cos(i/128*TAU)*d[5],0,Math.sin(i/128*TAU)*d[5]))),new T.LineBasicMaterial({color:0xf2d3a8,transparent:true,opacity:.12})));
  P.push({p,o:d[5],s:d[6],a:rnd(0,TAU)})});
 const mo=new T.Mesh(new T.SphereGeometry(.35,24,18),new T.MeshStandardMaterial({map:planetTex(['#e8dcd5','#9a8c92'],'rock'),roughness:1}));P[3].p.add(mo);
 phr(g,fl,6,28,32,-6,6);for(let i=0;i<5;i++)newCard(g,fl,28,32,-6,6);
 return{upd(t,dt){P.forEach(d=>{d.a+=dt*d.s*.25;d.p.position.set(Math.cos(d.a)*d.o,0,Math.sin(d.a)*d.o);d.p.userData.m.rotation.y+=dt*.4});mo.position.set(Math.cos(t*.9)*3,.4,Math.sin(t*.9)*3);s1.scale.setScalar(20*beat(t));orb(fl,t,dt)}}});
mk('Galaxia ámbar',22,g=>{const fl=[],n=12000,p=new Float32Array(n*3),c=new Float32Array(n*3),k=new T.Color();
 for(let i=0;i<n;i++){const r=Math.pow(Math.random(),1.6)*16+.3,a=r*.5+(i%3)*2.094+rnd(-.35,.35)*(1+r*.08);p.set([Math.cos(a)*r,rnd(-.4,.4)*(1.3-r/20),Math.sin(a)*r],i*3);k.setHSL(.08-r/16*.12,.8,.55+(1-r/16)*.3);k.toArray(c,i*3)}
 const ge=new T.BufferGeometry();ge.setAttribute('position',new T.BufferAttribute(p,3));ge.setAttribute('color',new T.BufferAttribute(c,3));
 const gal=new T.Points(ge,new T.PointsMaterial({size:.45,map:GW,vertexColors:true,transparent:true,depthWrite:false,blending:ADD}));g.add(gal);g.rotation.x=.38;
 const gl=glowSpr('#f2b97c',10,.9);g.add(gl,new T.PointLight(0xfff0dd,2.2,0));const pa=planet(1.1,['#c9b3ff','#7a5cc9','#3c2a7a'],'gas','#b49bff',1),pb=planet(.8,['#e9b7a5','#a8476b'],'rock','#ffc9b8',0);g.add(pa,pb);phr(g,fl,7,6,15,-1.5,2.5);for(let i=0;i<5;i++)newCard(g,fl,9,15,-2,2.5);
 return{upd(t,dt){gal.rotation.y+=dt*.07;pa.position.set(Math.cos(t*.12)*9,.5,Math.sin(t*.12)*9);pb.position.set(Math.cos(t*.08+2)*14,-.6,Math.sin(t*.08+2)*14);pa.userData.m.rotation.y+=dt*.4;pb.userData.m.rotation.y+=dt*.5;gl.scale.setScalar(9*beat(t));orb(fl,t,dt)}}});
mk('Constelaciones de ti',24,g=>{const fl=[],cg=new T.Group(),cs=[],L=[];g.add(cg);
 [['Tus ojos de café',eyeShape(),0xf2d3a8],['Los lentes de Orión',glassesShape(),0xe8c9ff],['Boca de Venus',lipsShape(),0xf5b8c8],['Cabellera de Berenice',hairShape(),0xf2d3a8],['La perla de Lyra',pearlShape(),0xfff1e8]].forEach((d,i)=>{const c=constel(d[0],d[1],d[2]),a=i/5*TAU;c.position.set(Math.cos(a)*14,(i%2?3.5:-2.5),Math.sin(a)*14);c.scale.setScalar(1.15);cg.add(c);cs.push(c);L.push(c.position)});
 cg.add(new T.LineLoop(new T.BufferGeometry().setFromPoints(L),new T.LineBasicMaterial({color:0xe9b7a5,transparent:true,opacity:.18,blending:ADD})));
 g.add(new T.PointLight(0xfff0dd,1.6,0));phr(g,fl,6,18,22,-5,6);for(let i=0;i<4;i++)newCard(g,fl,18,22,-5,5);
 return{upd(t,dt){cg.rotation.y+=dt*.035;cs.forEach(c=>{c.lookAt(cam.position);c.userData.st.forEach(s=>s.scale.setScalar(s.userData.b*(1+.4*Math.sin(t*2+s.userData.ph))))});orb(fl,t,dt)}}});
mk('Corazón de cristal',26,g=>{const fl=[],S=.3,N=36,M=56,gr=[],seg=[],all=[],hg=new T.Group();
 const hp=(t,a,s)=>{s=s||1;const X=16*Math.pow(Math.sin(t),3)*s,Y=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)-2)*s;return V(X*Math.cos(a)*S,Y*S,X*Math.sin(a)*S*.55)};
 for(let i=0;i<=N;i++){gr.push([]);for(let j=0;j<M;j++){const v=hp(i/N*Math.PI,j/M*TAU);gr[i].push(v);all.push(v)}}
 for(let i=0;i<=N;i++)for(let j=0;j<M;j++){seg.push(gr[i][j],gr[i][(j+1)%M]);if(j%4==0&&i<N)seg.push(gr[i][j],gr[i+1][j])}
 const wire=new T.LineSegments(new T.BufferGeometry().setFromPoints(seg),new T.LineBasicMaterial({color:0xf5b8c8,transparent:true,opacity:.34,blending:ADD}));
 const inner=new T.LineSegments(wire.geometry,new T.LineBasicMaterial({color:0xf2d3a8,transparent:true,opacity:.16,blending:ADD}));inner.scale.setScalar(.6);
 hg.add(wire,inner,new T.Points(new T.BufferGeometry().setFromPoints(all),new T.PointsMaterial({size:.38,map:GW,color:0xffe1d0,transparent:true,opacity:.95,depthWrite:false,blending:ADD})));
 const ip=[],ic=[],k=new T.Color();for(let i=0;i<2800;i++){const v=hp(Math.acos(rnd(-1,1)),rnd(0,TAU),Math.pow(Math.random(),.5));ip.push(v.x,v.y,v.z);k.setHSL(rnd(.92,1.04)%1,.7,rnd(.6,.85));ic.push(k.r,k.g,k.b)}
 const ig=new T.BufferGeometry();ig.setAttribute('position',new T.BufferAttribute(new Float32Array(ip),3));ig.setAttribute('color',new T.BufferAttribute(new Float32Array(ic),3));
 hg.add(new T.Points(ig,new T.PointsMaterial({size:.2,map:GW,vertexColors:true,transparent:true,opacity:.75,depthWrite:false,blending:ADD})));
 const core=glowSpr('#ff7aa8',16,.55);hg.add(core);g.add(hg,new T.PointLight(0xffd0d8,2.4,0));
 const rings=[[9.5,1.15,0],[12.5,.6,.8]].map(d=>{const q=new T.Group(),a=[];for(let i=0;i<700;i++){const th=rnd(0,TAU),r=d[0]+rnd(-.4,.4);a.push(Math.cos(th)*r,rnd(-.15,.15),Math.sin(th)*r)}
  const gm=new T.BufferGeometry();gm.setAttribute('position',new T.BufferAttribute(new Float32Array(a),3));q.add(new T.Points(gm,new T.PointsMaterial({size:.2,map:GW,color:0xf2d3a8,transparent:true,opacity:.8,depthWrite:false,blending:ADD})));q.rotation.set(d[1],0,d[2]);g.add(q);return q});
 const pl=[[planet(.9,['#e9b7a5','#a8476b'],'rock','#ffc9b8',0),9.5,.5,1.15,0],[planet(1.2,['#c9b3ff','#7a5cc9','#3c2a7a'],'gas','#b49bff',1),12.5,-.35,.6,.8]];pl.forEach(d=>g.add(d[0]));
 phr(g,fl,6,16,20,-5,6);for(let i=0;i<5;i++)newCard(g,fl,16,20,-5,5);
 return{upd(t,dt){const b=beat(t);hg.rotation.y+=dt*.22;hg.scale.setScalar(b);core.scale.setScalar(15*b);rings.forEach((q,i)=>q.rotation.y+=dt*(.1+i*.08));
  pl.forEach(d=>{const a=t*d[2],q=V(Math.cos(a)*d[1],0,Math.sin(a)*d[1]).applyEuler(new T.Euler(d[3],0,d[4]));d[0].position.copy(q);d[0].userData.m.rotation.y+=dt*.5});orb(fl,t,dt)}}});
}

// ---- Poemas, universos, galería y cámara
let pi=0,cur=0,tm,t0=0,Rt=34,Rc=34,th=0,ph=1.35,down=false,lx=0,ly=0,mx=0,my=0,pd=0,li=0;
function poem(){const c=$('cap');c.classList.remove('on');setTimeout(()=>{const p=POEMS[pi++%POEMS.length];$('tag').textContent=p[0];$('txt').innerHTML=p[1].split(' ').map((w,i)=>`<i style="transition-delay:${i*.09}s">${w}</i>`).join(' ');c.classList.add('on')},1200)}
function show(i,now){const f=()=>{U.forEach((u,k)=>u.g.visible=k===i);cur=i;Rt=U[i].R;if(!U[i].fl)mkFloat(U[i],i);[...$('dots').children].forEach((d,k)=>d.classList.toggle('on',k===i));$('un').textContent=['I','II','III','IV'][i]+'. '+U[i].name;$('un').classList.add('on');setTimeout(()=>$('un').classList.remove('on'),4000)};
 if(now){f();return}$('fade').style.opacity=1;setTimeout(()=>{f();$('fade').style.opacity=0},900)}
function rs(){clearInterval(tm);tm=setInterval(()=>show((cur+1)%U.length),50000)}
function openLB(i){if(!PHOTOS.length)return;li=(i+PHOTOS.length)%PHOTOS.length;$('li').src=PHOTOS[li];$('lb').classList.remove('off')}
$('gl').onclick=()=>openLB(0);$('lp').onclick=()=>openLB(li-1);$('ln').onclick=()=>openLB(li+1);$('lx').onclick=()=>$('lb').classList.add('off');
addEventListener('keydown',e=>{if(e.key=='Escape')$('lb').classList.add('off');if(e.key=='ArrowRight')openLB(li+1);if(e.key=='ArrowLeft')openLB(li-1)});
$('go').onclick=()=>{$('ov').classList.add('off');$('hud').classList.add('on');t0=performance.now();setTimeout(()=>{poem();setInterval(poem,10000)},3800);rs()};
$('lt').onclick=()=>{$('ft').textContent=NAME?'Antes de que se apaguen las estrellas, '+NAME:'Antes de que se apaguen las estrellas';$('fm').textContent='Hice este universo porque tu mirada me dejó sin palabras y con muchas ganas de intentarlo. No tengo prisa; solo quisiera la oportunidad de conocerte, y empezar por un café.';$('fin').classList.remove('off')};
$('fc').onclick=()=>$('fin').classList.add('off');
const cvs=ren.domElement,rc=new T.Raycaster();
function pick(e){rc.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam);const h=rc.intersectObjects(cards.filter(c=>c.parent&&c.parent.visible))[0];if(h)openLB(h.object.userData.photo)}
cvs.addEventListener('pointerdown',e=>{down=true;pd=0;lx=e.clientX;ly=e.clientY});
addEventListener('pointerup',e=>{if(down&&pd<6&&e.target===cvs)pick(e);down=false});
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;if(!down)return;pd+=Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly);th-=(e.clientX-lx)*.005;ph=Math.min(2.1,Math.max(.8,ph-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});
cvs.addEventListener('wheel',e=>{Rt=Math.min(52,Math.max(9,Rt+e.deltaY*.01))},{passive:true});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

function init(){IM.forEach((im,i)=>{PT.push(tex(cardCanvas(im,CAPS[i%CAPS.length])));PA.push(348/(im.height*320/im.width+70))});
 build();U.forEach((u,i)=>{const b=document.createElement('button');b.className='dot';b.title=u.name;b.setAttribute('aria-label',u.name);b.onclick=()=>{show(i);rs()};$('dots').appendChild(b)});show(0,true);$('go').disabled=false;
 if(!PHOTOS.length)$('gl').style.display='none';
 const clk=new T.Clock();
 (function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
  U[cur].upd(t,dt);floats(U[cur],t,dt);updSS(dt);
  const d=dgeo.attributes.position.array;for(let i=0;i<DN;i++){d[i*3+1]+=dt*.25;d[i*3]+=Math.sin(t*.6+i)*dt*.1;if(d[i*3+1]>16)d[i*3+1]=-14}dgeo.attributes.position.needsUpdate=true;
  starsA.rotation.y+=dt*.004;starsB.rotation.y-=dt*.006;
  Rc+=(Rt-Rc)*Math.min(dt*1.5,1);const k=t0?Math.min((performance.now()-t0)/5000,1):0,ex=t0?Math.pow(1-k,3):1;
  if(!down)th+=dt*.05;const rr=Rc+45*ex+Math.sin(t*.4)*.6;
  cam.position.set(rr*Math.sin(ph)*Math.sin(th)+mx*1.6,rr*Math.cos(ph)+1-my*1.2,rr*Math.sin(ph)*Math.cos(th));cam.lookAt(0,.4,0);ren.render(scene,cam)})()}
const loadImgs=Promise.all(PHOTOS.map((s,i)=>new Promise(r=>{const m=new Image();m.onload=()=>{IM[i]=m;r()};m.onerror=r;m.src=s})));
Promise.all([loadImgs,Promise.race([document.fonts.load("italic 600 40px 'Cormorant Garamond'"),new Promise(r=>setTimeout(r,2500))])]).then(init,init);
